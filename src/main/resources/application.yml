server:
  port: 8080

spring:
  application:
    name: ai-resource-booking

  datasource:
    url: ${BOOKING_DB_URL}
    username: ${BOOKING_DB_USERNAME}
    password: ${BOOKING_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  sql:
    init:
      mode: always
      encoding: UTF-8

  data:
    redis:
      host: localhost
      port: 6379

  kafka:
    bootstrap-servers: localhost:9092

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3

    consumer:
      group-id: booking-success-consumer
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

    listener:
      ack-mode: record

app:
  jwt-secret: ${APP_JWT_SECRET}
  jwt-expiration-seconds: ${APP_JWT_EXPIRATION_SECONDS:7200}
  bootstrap-admin-username: ${APP_BOOTSTRAP_ADMIN_USERNAME}
  bootstrap-admin-password: ${APP_BOOTSTRAP_ADMIN_PASSWORD}
